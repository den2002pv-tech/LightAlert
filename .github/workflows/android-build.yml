name: Android CI

on:
  push:
    branches:
      - main
      - feature/android-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIGHTALERT_KEYSTORE_BASE64: ${{ secrets.LIGHTALERT_KEYSTORE_BASE64 }}
      LIGHTALERT_KEYSTORE_PASSWORD: ${{ secrets.LIGHTALERT_KEYSTORE_PASSWORD }}
      LIGHTALERT_KEY_ALIAS: ${{ secrets.LIGHTALERT_KEY_ALIAS }}
      LIGHTALERT_KEY_PASSWORD: ${{ secrets.LIGHTALERT_KEY_PASSWORD }}
      LIGHTALERT_KEYSTORE_PATH: app/lightalert-upload.jks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release signing key
        if: env.LIGHTALERT_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$LIGHTALERT_KEYSTORE_BASE64" | base64 --decode > "$LIGHTALERT_KEYSTORE_PATH"

      - name: Build signed release APK
        if: env.LIGHTALERT_KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload signed release APK
        if: env.LIGHTALERT_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: LightAlert-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LightAlert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
